services:
  backend:
    build:
      context: ./backend
    container_name: backend_info_suplementos
    restart: always
    environment:
      PORT: 3333
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: app_user
      DB_PASS: app_pass
      DB_NAME: info_suplementos
      JWT_SECRET: chave_secreta
    ports:
      - '3333:3333'
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: mysql_info_suplementos
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: info_suplementos
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d

    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-u',
          'app_user',
          '-papp_pass',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_suplementos
    restart: always
    ports:
      - '8082:80'
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql

volumes:
  mysql_data:
